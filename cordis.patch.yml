# @flg1217/dsh-llm-agy bundle patch: inserts the dual-face plugin row into
# the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:...` or npm install.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (LLM adapter, web search provider, settings + discovery),
# and the `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: llm-agy
      name: '@flg1217/dsh-llm-agy'
      config:
        command: agy
        model: gemini-3.7-flash-high
        effort: high
        proxy: http://127.0.0.1:7890
